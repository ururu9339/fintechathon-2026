services:
  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://amanah:amanah@db:5432/amanahpay
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

  web:
    build: ./frontend
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
