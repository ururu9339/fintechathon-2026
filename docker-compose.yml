services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://amanah:amanah@db:5432/amanahpay
      AMANAHPAY_DOCKER: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amanah
      POSTGRES_PASSWORD: amanah
      POSTGRES_DB: amanahpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amanah -d amanahpay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
